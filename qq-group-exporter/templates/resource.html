<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成资源清单 - QQ群成员导出工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .back-link {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 24px 30px;
            margin-bottom: 16px;
        }

        .group-info-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            color: #555;
            font-size: 0.95rem;
        }

        .group-info-bar .group-name {
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
        }

        .file-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 16px;
        }

        .file-row:last-child {
            margin-bottom: 0;
        }

        .file-label {
            font-weight: 600;
            color: #333;
            min-width: 130px;
            flex-shrink: 0;
        }

        .file-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            background: #667eea;
            color: white;
            font-family: inherit;
            transition: all 0.2s;
        }

        .file-btn:hover {
            background: #5568d3;
        }

        .file-path {
            color: #666;
            font-size: 0.9rem;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-path.empty {
            color: #bbb;
            font-style: italic;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
        }

        .btn-success:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-row {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 16px;
        }

        .members-section h2 {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 12px;
        }

        .members-section .hint {
            font-size: 0.8rem;
            font-weight: normal;
            color: #999;
            margin-left: 6px;
        }

        .search-box {
            position: relative;
            margin-bottom: 10px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: #667eea;
        }

        .dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            max-height: 280px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .dropdown.active {
            display: block;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.15s;
            gap: 10px;
        }

        .dropdown-item:hover {
            background: #f5f7ff;
        }

        .dropdown-avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            object-fit: cover;
            background: #f0f0f0;
            flex-shrink: 0;
        }

        .dropdown-info {
            flex: 1;
            min-width: 0;
        }

        .dropdown-name {
            font-size: 0.9rem;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dropdown-sub {
            font-size: 0.75rem;
            color: #999;
        }

        .selected-list {
            border: 1px dashed #e0e0e0;
            border-radius: 10px;
            padding: 10px;
            min-height: 120px;
            max-height: 300px;
            overflow-y: auto;
        }

        .selected-empty {
            color: #bbb;
            text-align: center;
            padding: 30px 10px;
            font-size: 0.9rem;
        }

        .selected-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 6px;
            background: #fff8e6;
            gap: 10px;
        }

        .selected-item .avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            object-fit: cover;
            background: #f0f0f0;
            flex-shrink: 0;
        }

        .selected-item .info {
            flex: 1;
            min-width: 0;
        }

        .selected-item .name {
            font-size: 0.9rem;
            color: #333;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .selected-item .sub {
            font-size: 0.75rem;
            color: #999;
        }

        .selected-item .remove-btn {
            width: 24px;
            height: 24px;
            border: none;
            background: #ff6b6b;
            color: white;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .selected-item .remove-btn:hover {
            background: #ee5a5a;
        }

        .spinner-inline {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-small {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>生成资源清单</h1>
            <a href="/" class="back-link">← 返回首页</a>
        </header>

        <div class="card">
            <div class="group-info-bar">
                <span>当前群：</span>
                <span class="group-name" id="group-name-display">加载中...</span>
            </div>
        </div>

        <div class="card">
            <div class="file-row">
                <span class="file-label">资源链接文件：</span>
                <button class="file-btn" onclick="document.getElementById('link-file').click()">选择文件</button>
                <input type="file" id="link-file" accept=".xlsx" onchange="onLinkFileSelected(event)">
                <span class="file-path empty" id="link-file-path">未选择</span>
            </div>
            <div class="file-row">
                <span class="file-label">资源清单模版：</span>
                <button class="file-btn" onclick="document.getElementById('template-file').click()">选择文件</button>
                <input type="file" id="template-file" accept=".xlsx" onchange="onTemplateFileSelected(event)">
                <span class="file-path empty" id="template-file-path">未选择</span>
            </div>
        </div>

        <div class="card members-section">
            <h2>还未缴费成员 <span class="hint">（从群成员中选择，可选）</span></h2>
            <div class="search-box">
                <input type="text" id="unpaid-search" placeholder="输入昵称或QQ号搜索..." oninput="searchUnpaid()" onfocus="searchUnpaid()">
                <div id="unpaid-dropdown" class="dropdown"></div>
            </div>
            <div id="unpaid-loading" class="loading-small">
                <span class="spinner-inline"></span>正在加载群成员...
            </div>
            <div id="unpaid-selected" class="selected-list" style="display: none;">
                <div class="selected-empty">已选择的未缴费成员将显示在这里</div>
            </div>
        </div>

        <div class="btn-row">
            <button id="generate-btn" class="btn btn-success" onclick="generateResourceList()" disabled>生成资源清单</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const groupId = parseInt(params.get('group_id'));
        const groupName = params.get('group_name') || '';
        let allMembers = [];
        let unpaidMembers = [];
        let linkFile = null;
        let templateFile = null;

        document.getElementById('group-name-display').textContent = groupName || `群${groupId}`;

        function onLinkFileSelected(event) {
            const file = event.target.files[0];
            if (file) {
                linkFile = file;
                document.getElementById('link-file-path').textContent = file.name;
                document.getElementById('link-file-path').classList.remove('empty');
            }
            updateGenerateButton();
        }

        function onTemplateFileSelected(event) {
            const file = event.target.files[0];
            if (file) {
                templateFile = file;
                document.getElementById('template-file-path').textContent = file.name;
                document.getElementById('template-file-path').classList.remove('empty');
            }
            updateGenerateButton();
        }

        async function loadMembers() {
            try {
                const resp = await fetch(`/api/resource/members/${groupId}`);
                const data = await resp.json();
                if (data.members) {
                    allMembers = data.members;
                    document.getElementById('unpaid-loading').style.display = 'none';
                    document.getElementById('unpaid-selected').style.display = 'block';
                }
            } catch (e) {
                document.getElementById('unpaid-loading').innerHTML =
                    '<span style="color:#e74c3c;">加载成员失败，请确认 NapCatQQ 正在运行</span>';
                console.error(e);
            }
        }

        let unpaidSearchTimer = null;
        function searchUnpaid() {
            clearTimeout(unpaidSearchTimer);
            unpaidSearchTimer = setTimeout(() => {
                const keyword = document.getElementById('unpaid-search').value.trim().toLowerCase();
                const dropdown = document.getElementById('unpaid-dropdown');

                if (!keyword) {
                    dropdown.classList.remove('active');
                    return;
                }

                const unpaidIds = new Set(unpaidMembers.map(m => m.user_id));
                const filtered = allMembers.filter(m =>
                    !unpaidIds.has(m.user_id) &&
                    (m.nickname.toLowerCase().includes(keyword) ||
                     (m.card && m.card.toLowerCase().includes(keyword)) ||
                     String(m.user_id).includes(keyword))
                ).slice(0, 20);

                if (filtered.length === 0) {
                    dropdown.innerHTML = '<div class="selected-empty">无匹配结果</div>';
                } else {
                    dropdown.innerHTML = filtered.map(m => {
                        const avatar = `https://q1.qlogo.cn/g?b=qq&nk=${m.user_id}&s=100`;
                        const displayName = m.card && m.card !== m.nickname
                            ? `${m.nickname} (${m.card})`
                            : m.nickname;
                        return `
                            <div class="dropdown-item" onclick="addUnpaidMember(${m.user_id})">
                                <img class="dropdown-avatar" src="${avatar}" onerror="this.style.display='none'">
                                <div class="dropdown-info">
                                    <div class="dropdown-name">${escapeHtml(displayName)}</div>
                                    <div class="dropdown-sub">QQ: ${m.user_id}</div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
                dropdown.classList.add('active');
            }, 200);
        }

        function addUnpaidMember(userId) {
            const member = allMembers.find(m => m.user_id === userId);
            if (!member) return;
            if (unpaidMembers.find(m => m.user_id === userId)) return;
            unpaidMembers.push(member);
            document.getElementById('unpaid-search').value = '';
            document.getElementById('unpaid-dropdown').classList.remove('active');
            renderUnpaidSelected();
        }

        function renderUnpaidSelected() {
            const container = document.getElementById('unpaid-selected');
            if (unpaidMembers.length === 0) {
                container.innerHTML = '<div class="selected-empty">已选择的未缴费成员将显示在这里</div>';
                return;
            }
            container.innerHTML = unpaidMembers.map(m => {
                const avatar = `https://q1.qlogo.cn/g?b=qq&nk=${m.user_id}&s=100`;
                const displayName = m.card && m.card !== m.nickname
                    ? `${m.nickname} (${m.card})`
                    : m.nickname;
                return `
                    <div class="selected-item">
                        <img class="avatar" src="${avatar}" onerror="this.style.display='none'">
                        <div class="info">
                            <div class="name">${escapeHtml(displayName)}</div>
                            <div class="sub">QQ: ${m.user_id}</div>
                        </div>
                        <button class="remove-btn" onclick="removeUnpaidMember(${m.user_id})">×</button>
                    </div>
                `;
            }).join('');
        }

        function removeUnpaidMember(userId) {
            unpaidMembers = unpaidMembers.filter(m => m.user_id !== userId);
            renderUnpaidSelected();
        }

        function updateGenerateButton() {
            const btn = document.getElementById('generate-btn');
            btn.disabled = !(linkFile && templateFile && allMembers.length > 0);
        }

        async function generateResourceList() {
            if (!linkFile || !templateFile) return;

            const btn = document.getElementById('generate-btn');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '生成中...';

            try {
                const formData = new FormData();
                formData.append('link_file', linkFile);
                formData.append('template_file', templateFile);
                formData.append('group_id', groupId);
                formData.append('group_name', groupName);
                formData.append('unpaid_member_ids', JSON.stringify(unpaidMembers.map(m => m.user_id)));

                const resp = await fetch('/api/resource/generate', {
                    method: 'POST',
                    body: formData
                });

                if (resp.ok) {
                    const blob = await resp.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;

                    let filename = null;
                    const disp = resp.headers.get('Content-Disposition');
                    if (disp) {
                        const m = disp.match(/filename\*=UTF-8''([^;]+)/i);
                        if (m) filename = decodeURIComponent(m[1]);
                    }
                    if (!filename) {
                        filename = `资源清单-${groupName}.zip`;
                    }
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    btn.textContent = '生成成功';
                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn.disabled = false;
                    }, 2000);
                } else {
                    let errorMsg = '未知错误';
                    try {
                        const data = await resp.json();
                        errorMsg = data.error || errorMsg;
                    } catch {}
                    alert('生成失败: ' + errorMsg);
                    btn.textContent = originalText;
                    btn.disabled = false;
                }
            } catch (e) {
                alert('生成失败: ' + e.message);
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-box')) {
                document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active'));
            }
        });

        loadMembers();
    </script>
</body>
</html>
